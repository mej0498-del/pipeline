samples: sample.tsv
reference: "resources/reference.fasta"

# You can add extra options passed straight to fastp and bwa
fastp:
  extra: ""

bwa:
  extra: ""

threads:
  fastp: 4
  bwa: 6

# java memory per GATK job in GB, you can set to fit your machine
gatk:
  mem_gb: 8 

# You can change the values if you want
coverage:
  window_size: 10000    
  window_step: 5000     